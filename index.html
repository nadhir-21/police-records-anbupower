<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سجل مراجعات شرطة</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0d12;
    color: white;
    min-height: 100vh;
}

.login {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: #141821;
    border: 1px solid #252b38;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #8992a3;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd1dc;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid #303746;
    background: #0d1016;
    color: white;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #4d8cff;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2868ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3b76ff;
}

.error {
    color: #ff6262;
    text-align: center;
    margin-top: 15px;
    display: none;
}

.dashboard {
    display: none;
    padding: 25px 15px;
    max-width: 1000px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.header p {
    color: #8992a3;
}

.sections {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.section {
    background: #141821;
    border: 1px solid #252b38;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    transition: .2s;
}

.section:hover {
    transform: translateY(-4px);
    border-color: #2868ff;
}

.icon {
    font-size: 42px;
    margin-bottom: 15px;
}

.section h2 {
    margin-bottom: 10px;
}

.section p {
    color: #8992a3;
    margin-bottom: 20px;
}

.logout {
    margin: 30px auto 0;
    display: block;
    max-width: 200px;
    background: #252b38;
}

.logout:hover {
    background: #343c4d;
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<div class="login" id="loginPage">

    <div class="login-box">

        <div class="logo">شرطة Anime Power</div>

        <div class="subtitle">
            سجل مراجعات الشرطة
        </div>

        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم">

        <label>كلمة السر</label>
        <input type="password" id="password" placeholder="أدخل كلمة السر">

        <button onclick="login()">دخول</button>

        <div class="error" id="error">
            اسم المستخدم أو كلمة السر غير صحيحة
        </div>

    </div>

</div>


<!-- لوحة التحكم -->
<div class="dashboard" id="dashboard">

    <div class="header">
        <h1>سجل مراجعات شرطة</h1>
        <p>اختر القسم الذي تريد مراجعة سجلاته</p>
    </div>

    <div class="sections">

        <div class="section">
            <div class="icon">📝</div>
            <h2>قسم المحتوى</h2>
            <p>تقارير ومراجعة أعمال قسم المحتوى</p>
            <button>دخول القسم</button>
        </div>

        <div class="section">
            <div class="icon">🎨</div>
            <h2>قسم التصميم</h2>
            <p>تقارير ومراجعة أعمال قسم التصميم</p>
            <button>دخول القسم</button>
        </div>

        <div class="section">
            <div class="icon">⚡</div>
            <h2>قسم الفعاليات</h2>
            <p>تقارير ومراجعة أعمال قسم الفعاليات</p>
            <button>دخول القسم</button>
        </div>

    </div>

    <button class="logout" onclick="logout()">تسجيل الخروج</button>

</div>


<script>

function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    /*
      الحساب الأول مؤقت.
      سنضيف نظام الحسابات لاحقًا.
    */

    if (username === "admin" && password === "1234") {

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

    } else {

        document.getElementById("error").style.display = "block";

    }
}

function logout() {

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

}

</script>

</body>
</html>
